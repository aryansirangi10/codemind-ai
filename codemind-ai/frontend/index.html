<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeMind AI — Enterprise AI Engineering Intelligence Platform</title>
    
    <!-- Design System Stylesheets -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="spotlight-element">

    <!-- 3D Neural background Canvas -->
    <canvas id="canvas-ast-network" style="position: fixed; inset: 0; pointer-events: none; z-index: -1;"></canvas>

    <!-- 1. Landing View container -->
    <div id="view-landing" class="view-section"></div>

    <!-- 2. Auth View container -->
    <div id="view-auth" class="view-section"></div>

    <!-- 3. Console Workspace container -->
    <div id="console-layout" class="console-wrapper hidden">
        <!-- Sidebar Navigation -->
        <aside id="console-sidebar" class="sidebar-container"></aside>
        
        <!-- Main Panel Content -->
        <main class="main-console-content">
            <!-- Utility breadcrumb headers -->
            <header id="breadcrumb-utility-bar" class="top-breadcrumb-bar"></header>

            <!-- Overview Dashboard -->
            <div id="console-view-dashboard" class="console-page-view hidden"></div>

            <!-- Repository Space (contains sub-tabs: Overview, Explorer, Reviews, Security, Analytics, Reports, Settings) -->
            <div id="console-view-repository" class="console-page-view hidden h-full flex flex-col min-h-0"></div>

            <!-- Team Collaboration Page -->
            <div id="console-view-team" class="console-page-view hidden"></div>

            <!-- Integrations Page -->
            <div id="console-view-integrations" class="console-page-view hidden"></div>

            <!-- API Playground Page -->
            <div id="console-view-playground" class="console-page-view hidden"></div>

            <!-- Billing Page -->
            <div id="console-view-billing" class="console-page-view hidden"></div>

            <!-- Organization Audit logs -->
            <div id="console-view-logs" class="console-page-view hidden"></div>

            <!-- Settings Page -->
            <div id="console-view-settings" class="console-page-view hidden"></div>
        </main>
    </div>

    <!-- Script Entrypoint Modules loader -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
